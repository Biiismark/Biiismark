name: Atualizar catálogo de vídeos da Isabella

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * 1"
  push:
    branches: [main]
    paths:
      - "markfit/scripts/update_isabella_catalog.py"
      - ".github/workflows/markfit-catalog.yml"

permissions:
  contents: write

concurrency:
  group: markfit-isabella-catalog
  cancel-in-progress: false

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar coletor gratuito
        run: python -m pip install --upgrade yt-dlp
      - name: Atualizar metadados públicos
        working-directory: markfit
        run: python scripts/update_isabella_catalog.py
      - name: Salvar catálogo atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add markfit/public/data/isabella-catalog.json
          if git diff --cached --quiet; then
            echo "Catálogo sem alterações; nenhuma gravação necessária."
          else
            git commit -m "Atualiza catálogo público de vídeos Isabella"
            git push
          fi
